<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f8f9fc" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Enforces "nothing leaves the device": every fetch type is limited to this origin (MediaPipe
      otherwise posts telemetry to Google every 60 s). A meta tag, not a header, because an intranet
      build is often a plain folder where headers may not be configurable. MediaPipe needs
      `wasm-unsafe-eval`.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />

    <title>BlitzPose</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
